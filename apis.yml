name: Parallel Universe
description: >-
  Parallel Universe Inc. (Parallel Studios) is the Toronto-based game studio behind
  Parallel, a free-to-play sci-fi trading card game, and the broader Parallel Universe
  franchise that includes Colony, an AI agent simulation game, and Sanctuary, a
  third-person extraction shooter. The studio anchors the Echelon Prime web3 gaming
  ecosystem, where players truly own their cards and in-game items as blockchain assets
  and the PRIME token powers governance and rewards. Backed by a16z (Andreessen Horowitz)
  and Paradigm, Parallel is a consumer game franchise distributed via the web, Epic Games,
  Steam, the Apple App Store, and Google Play. It publishes no public developer / REST API
  surface today; this profile captures the studio's public web, community, and legal
  properties as harvested by the API Evangelist enrichment pipeline.
